
name: Build Rhythm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Rhythm Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

            - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Jamendo Client ID
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -z "$JAMENDO_CLIENT_ID" ]; then
            echo "::error::JAMENDO_CLIENT_ID secret is missing"
            exit 1
          fi

      - name: Locate Android project
        run: |
          echo "Searching for Gradle project..."
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build Rhythm APK
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          SETTINGS_FILE=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find . -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK file not found"
            exit 1
          fi

          echo "Found APK: $APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Rhythm APK
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
          
